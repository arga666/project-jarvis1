name: jarvis_assistant
description: "Jarvis (Vis) - Autonomous Virtual Personal Assistant with Android Floating Overlay, Low-Latency Gemini Engine, Gaming Mode RAM Saver, and Sleep Cycle Awareness."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  http: ^1.2.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  provider: ^6.1.2
  flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
