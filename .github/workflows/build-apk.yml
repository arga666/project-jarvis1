name: Build & Release Jarvis Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Prepare Android Project & Dependencies
        run: |
          mkdir -p custom_backup
          cp -r android/app/src/main/kotlin/com/jarvis/assistant custom_backup/
          cp android/app/src/main/AndroidManifest.xml custom_backup/
          
          rm -rf android
          flutter create --platforms=android --org com.jarvis --project-name jarvis_assistant .
          
          rm -rf android/app/src/main/kotlin/*
          mkdir -p android/app/src/main/kotlin/com/jarvis/assistant
          cp -r custom_backup/assistant/* android/app/src/main/kotlin/com/jarvis/assistant/
          cp custom_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          
          sed -i 's/compileSdk = .*/compileSdk = 34/' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 26/' android/app/build.gradle || true
          sed -i 's/targetSdk = .*/targetSdk = 34/' android/app/build.gradle || true
          sed -i 's/namespace = .*/namespace = "com.jarvis.assistant"/' android/app/build.gradle || true
          sed -i 's/applicationId = .*/applicationId = "com.jarvis.assistant"/' android/app/build.gradle || true

          flutter pub get
          chmod +x scripts/patch_gradle.sh
          bash scripts/patch_gradle.sh

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Prepare Release File
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/Jarvis-Assistant.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Assistant-APK
          path: release-output/Jarvis-Assistant.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Jarvis Virtual Assistant v1.0.0 (Release APK)"
          body: |
            ### 🚀 Jarvis (Vis) - Autonomous Android Assistant APK
            
            Silakan download file **`Jarvis-Assistant.apk`** di bawah ini dan instal langsung di HP Android kamu!
            
            #### 📥 Download Langsung:
            - **[Download Jarvis-Assistant.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0/Jarvis-Assistant.apk)**
            
            #### 🌟 Fitur Utama:
            - **Persona & Gaya Bicara:** Santai, cowok muda, lu-gua, berani membantah & mendebat argumen salah.
            - **Respon Super Cepat:** Low latency ~2-3 detik via Gemini Engine.
            - **Floating Overlay:** Orb bulat gradasi dark blue melayang di atas semua aplikasi.
            - **Wake-Word & Background Service:** Otomatis respons saat dipanggil "Jarvis" atau "Vis".
            - **Alarm Suara Otomatis:** Perintah suara langsung masuk ke jam alarm sistem Android.
            - **Sleep Cycle & Anti-Begadang:** Pengingat otomatis saat lewat jam tidur dengan gaya sahabat peduli.
            - **Gaming Mode (RAM Saver):** *"Vis tidur dulu gua mau main game"* -> Membekukan visual & membebaskan RAM.
            
            #### ⚠️ Catatan Instalasi di HP:
            1. Buka file APK di HP, jika muncul konfirmasi keamanan pilih **"Tetap Install" / "Izinkan dari sumber ini"**.
            2. Buka aplikasi Jarvis, masuk menu Pengaturan dan masukkan **Gemini API Key**.
            3. Berikan izin **Display over other apps** (System Overlay).
            4. Matikan **Battery Optimization** agar Jarvis bisa standby terus di background.
          files: release-output/Jarvis-Assistant.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
